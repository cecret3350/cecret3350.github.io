<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Inference-time DEConv re-parameterized as one convolution</title>
  <desc id="desc">The five training kernels are merged into a single converted convolution kernel.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#df8d35"/>
    </marker>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#86b8d2"/>
      <path d="M18 0H0V18" fill="none" stroke="#294550" stroke-width="1.4"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#fbfaf7"/>
  <text x="34" y="48" fill="#243332" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2">INFERENCE-TIME CONV</text>
  <text x="34" y="76" fill="#7d8784" font-family="Arial, sans-serif" font-size="14">Re-parameterized into one vanilla convolution</text>

  <g stroke="#df8d35" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M188 255H305"/>
    <path d="M495 255H612"/>
  </g>

  <rect x="98" y="210" width="90" height="90" rx="4" fill="url(#grid)" stroke="#294550" stroke-width="2"/>
  <rect x="98" y="210" width="30" height="30" fill="#e2a13b" stroke="#294550" stroke-width="1.5"/>
  <text x="143" y="326" fill="#596865" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Input</text>

  <rect x="305" y="164" width="190" height="182" rx="12" fill="#f7f1df" stroke="#bca76b" stroke-width="2"/>
  <rect x="355" y="192" width="90" height="90" rx="4" fill="url(#grid)" stroke="#294550" stroke-width="2"/>
  <rect x="355" y="192" width="30" height="30" fill="#e2a13b" stroke="#294550" stroke-width="1.5"/>
  <text x="400" y="314" fill="#243332" font-family="Georgia, serif" font-size="25" font-style="italic" text-anchor="middle">K<tspan dy="5" font-size="16">cvt</tspan></text>

  <rect x="612" y="210" width="90" height="90" rx="4" fill="url(#grid)" stroke="#294550" stroke-width="2"/>
  <text x="657" y="326" fill="#596865" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Output</text>

  <rect x="257" y="392" width="286" height="47" rx="23.5" fill="#eef1ed"/>
  <text x="400" y="422" fill="#52625f" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">K<tspan dy="4" font-size="12">cvt</tspan><tspan dy="-4"> = K</tspan><tspan dy="4" font-size="12">VC</tspan><tspan dy="-4"> + K</tspan><tspan dy="4" font-size="12">CDC</tspan><tspan dy="-4"> + K</tspan><tspan dy="4" font-size="12">ADC</tspan><tspan dy="-4"> + K</tspan><tspan dy="4" font-size="12">HDC</tspan><tspan dy="-4"> + K</tspan><tspan dy="4" font-size="12">VDC</tspan></text>
</svg>
