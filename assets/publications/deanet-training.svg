<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Training-time DEConv with five convolution branches</title>
  <desc id="desc">The input feature is processed by VC, CDC, ADC, HDC, and VDC in parallel, then summed.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#7fa9c3"/>
    </marker>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#86b8d2"/>
      <path d="M18 0H0V18" fill="none" stroke="#294550" stroke-width="1.4"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#fbfaf7"/>
  <text x="34" y="48" fill="#243332" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2">TRAINING-TIME DECONV</text>
  <text x="34" y="76" fill="#7d8784" font-family="Arial, sans-serif" font-size="14">Five parallel convolution branches</text>

  <g stroke="#7fa9c3" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M145 253C190 253 188 131 246 131"/>
    <path d="M145 253C192 253 191 193 246 193"/>
    <path d="M145 253H246"/>
    <path d="M145 253C192 253 191 317 246 317"/>
    <path d="M145 253C190 253 188 379 246 379"/>
    <path d="M466 131C530 131 521 228 574 244"/>
    <path d="M466 193C520 193 526 232 574 248"/>
    <path d="M466 255H574"/>
    <path d="M466 317C520 317 526 278 574 262"/>
    <path d="M466 379C530 379 521 282 574 266"/>
    <path d="M616 255H672"/>
  </g>

  <g>
    <rect x="55" y="203" width="90" height="90" rx="4" fill="url(#grid)" stroke="#294550" stroke-width="2"/>
    <rect x="55" y="203" width="30" height="30" fill="#e2a13b" stroke="#294550" stroke-width="1.5"/>
    <text x="74" y="326" fill="#596865" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Input</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#263837">
    <g><rect x="246" y="104" width="220" height="54" rx="7" fill="#f4c247" stroke="#b98c24" stroke-width="2"/><text x="272" y="138">VC</text><text x="430" y="138" font-size="14" font-weight="400" text-anchor="end">vanilla</text></g>
    <g><rect x="246" y="166" width="220" height="54" rx="7" fill="#f5e7bd" stroke="#cbb77a" stroke-width="2"/><text x="272" y="200">CDC</text><text x="430" y="200" font-size="14" font-weight="400" text-anchor="end">central</text></g>
    <g><rect x="246" y="228" width="220" height="54" rx="7" fill="#f5e7bd" stroke="#cbb77a" stroke-width="2"/><text x="272" y="262">ADC</text><text x="430" y="262" font-size="14" font-weight="400" text-anchor="end">angular</text></g>
    <g><rect x="246" y="290" width="220" height="54" rx="7" fill="#f5e7bd" stroke="#cbb77a" stroke-width="2"/><text x="272" y="324">HDC</text><text x="430" y="324" font-size="14" font-weight="400" text-anchor="end">horizontal</text></g>
    <g><rect x="246" y="352" width="220" height="54" rx="7" fill="#f5e7bd" stroke="#cbb77a" stroke-width="2"/><text x="272" y="386">VDC</text><text x="430" y="386" font-size="14" font-weight="400" text-anchor="end">vertical</text></g>
  </g>

  <circle cx="595" cy="255" r="21" fill="#fff" stroke="#273b3a" stroke-width="2.5"/>
  <path d="M585 255h20M595 245v20" stroke="#273b3a" stroke-width="2.5"/>
  <rect x="672" y="210" width="90" height="90" rx="4" fill="url(#grid)" stroke="#294550" stroke-width="2"/>
  <text x="717" y="326" fill="#596865" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Output</text>
</svg>
